<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width">
    <title>EcoApp</title>
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <div id="app">
        <header>
            <h1>EcoApp Sostenible </h1>
        </header>

        <main id="main-content">
            <!-- Vista de Inicio -->
            <section id="vista-inicio" class="view active">
                <h2>Inicio</h2>
                <p>Bienvenido a tu app de hábitos ecológicos.</p>
            </section>

            <!-- Vista de Calculadora -->
            <section id="vista-calculadora" class="view" style="display: none;">
                <h2>Calculadora de Impacto</h2>
                <p>Aquí irá la calculadora de CO2.</p>
            </section>

            <!-- Vista de Perfil -->
            <section id="vista-perfil" class="view" style="display: none;">
                <h2>Mi Perfil y Metas</h2>
                <p>Personaliza tu información y establece tus objetivos ecológicos.</p>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="input-nombre" style="display: block; margin-bottom: 5px; font-weight: bold;">Tu
                        Nombre:</label>
                    <input type="text" id="input-nombre" placeholder="Ej. Rosario"
                        style="width: 100%; padding: 8px; box-sizing: border-box;">
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="input-meta" style="display: block; margin-bottom: 5px; font-weight: bold;">Meta
                        Ecológica Mensual:</label>
                    <input type="text" id="input-meta" placeholder="Ej. Reducir uso de botellas plásticas"
                        style="width: 100%; padding: 8px; box-sizing: border-box;">
                </div>

                <button onclick="guardarPerfil()"
                    style="background-color: #2e7d32; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold;">Guardar
                    Perfil</button>

                <p id="mensaje-guardado" style="color: #2e7d32; margin-top: 10px; font-weight: bold;"></p>
            </section>
        </main>

        <nav class="nav-bar">
            <button onclick="cambiarVista('inicio')">Inicio</button>
            <button onclick="cambiarVista('calculadora')">Calculadora</button>
            <button onclick="cambiarVista('perfil')">Perfil</button>
        </nav>
    </div>
    <script src="js/index.js"></script>
</body>

</html>
